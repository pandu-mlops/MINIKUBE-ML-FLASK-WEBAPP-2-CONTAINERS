apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  annotations:
    kubernetes.io/change-cause: "NEW Version 2 deployment of Flask app"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: pandumlops/placement-web-app:new-v2
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000" # Flask's default port
